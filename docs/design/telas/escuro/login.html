<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#f7f8fa;--fg:#14171c;--surface:#ffffff;--surface2:#eef0f3;--line:#e2e5ea;--muted:#5d6673;--err:#c81e1e}
.t-dark{--bg:#0b0e13;--fg:#e8ebf0;--surface:#12161d;--surface2:#1b2029;--line:#232a35;--muted:#8b95a5;--err:#f87171}
a{color:inherit;text-decoration:none}
.input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;outline:none}
.input:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.btn:hover{background:#047857!important}
</style>
</head>
<body>
<div class="t-dark" style="min-height: 100vh; background: var(--bg); color: var(--fg); font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box">
<div style="width: 100%; max-width: 384px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="display: inline-flex; width: 48px; height: 48px; border-radius: 12px; align-items: center; justify-content: center; background: #059669; color: #ffffff">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7" /><polyline points="15 7 21 7 21 13" /></svg>
</span>
<h1 style="margin: 6px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Análise de Ações</h1>
<p style="margin: 0; font-size: 14px; color: var(--muted)">Entre para ver o painel diário</p>
</div>
<form style="border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 13px; font-weight: 500">E-mail</label>
<input id="email" name="email" type="email" autocomplete="email" class="input" value="usuario@exemplo.com">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="senha" style="font-size: 13px; font-weight: 500">Senha</label>
<input id="senha" name="senha" type="password" autocomplete="current-password" class="input" value="senha-errada">
</div>

<div role="alert" style="display: flex; gap: 8px; align-items: center; border: 1px solid rgba(220,38,38,.35); background: rgba(220,38,38,.1); color: var(--err); border-radius: 8px; padding: 10px 12px; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
E-mail ou senha inválidos.
</div>

<a href="painel.html" class="btn" style="display: flex; align-items: center; justify-content: center; min-height: 42px; border-radius: 8px; background: #059669; color: #ffffff; font-weight: 600; font-size: 14px">Entrar</a>
</form>
<p style="margin: 0; text-align: center; font-size: 12px; color: var(--muted)">Acesso restrito. Usuários são criados pelo administrador.</p>
</div>
</div>
</body>
</html>
